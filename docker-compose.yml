version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - DEBUG=False
      - SECRET_KEY=change-me
      - DATABASE_URL=sqlite:///db.sqlite3
      - ORS_API_KEY=${ORS_API_KEY}
      - ORS_BASE_URL=${ORS_BASE_URL}
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '4173:4173'
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
